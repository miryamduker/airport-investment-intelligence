# Scoring configuration: thresholds, metric polarity, and pillar weights.
# Every threshold and weight in scoring/ is read from here.
#
# "Implemented" is not a flag in this file -- scoring/score.py derives it
# from whether the metric's column exists in mart_airport_metrics.parquet, so
# a metric can't claim to be implemented while nothing computes it.
# Unimplemented metrics stay listed below, with polarity, so the full
# four-pillar model remains documented.

thresholds:
  # Minimum DEPARTURES_PERFORMED for an origin to enter the mart. Below one
  # departure a day, a single month of T-100 is too thin for a percentile to
  # mean anything. Sits near the p25 breakpoint of the May 2026 pull.
  min_departures_threshold: 30

  # A separate question from the threshold above: that one asks whether the
  # data is trustworthy, this one asks whether the airport is a plausible
  # target for expansion capital at all. non_hub airports are under 0.05% of
  # national passengers, and percentile rank measures "unusual for its
  # cohort", not "big enough to matter" -- so a thin month can float one to
  # the top of its own cohort. Excluded from rankings, but kept in the mart
  # for descriptive queries like flight_mix.
  investable_hub_sizes: [large, medium, small]

# Per-airport confidence blends three independent reliability signals
# (scoring/score.py: compute_confidence). A pillar-availability count was
# tried first and rejected: it came out 0.75 for every airport in the
# dataset. Weights sum to 1 and are a judgment call, not a fitted parameter.
confidence:
  # Share of implemented metrics with a real value for this airport. Catches
  # per-airport gaps a pillar-level count misses: no OurAirports runway
  # match, zero passengers, no On-Time Performance match at all.
  metric_coverage_weight: 0.4
  # How much traffic backs the percentile. An airport just over the
  # 30-departure threshold is far noisier than a hub, though both "have" a
  # load_factor. Ramps linearly to full confidence.
  volume_weight: 0.3
  # ~1,000 departures/month is ~33/day, roughly hourly across an operating
  # day, and sits near the 80th percentile of May 2026 survivors -- so the
  # ramp discriminates instead of saturating nearly everyone.
  full_confidence_departures: 1000
  # Distinct carriers reporting OTP data. Two carriers is a much thinner base
  # for capacity_strain than eight; no OTP match floors this at 0, which is a
  # confidence signal, not a metric value (the metrics themselves stay NaN).
  carrier_diversity_weight: 0.3
  # May 2026's observed range is 1-13 reporting carriers, median 3.
  full_confidence_carriers: 8

pillars:
  demand_pressure:
    metrics:
      load_factor:
        polarity: 1   # fuller flights = more demand pressure
      peak_month_concentration:
        polarity: -1  # not implemented -- needs multi-month T-100 history
      upgauge_gap:
        polarity: -1  # not implemented -- needs multi-month T-100 history

  capacity_strain:
    # completion_gap (1 - performed/scheduled) was implemented and removed:
    # 62% of surviving airports show performed > scheduled, worst at major
    # hubs (JFK +23%), so it measured carrier schedule-filing behaviour, not
    # strain. See docs/LIMITATIONS.md.
    #
    # All four metrics below come from On-Time Performance instead, which
    # only covers reporting carriers -- 131 of the 132 investable hubs match
    # for May 2026. The pillar is NaN for the rest: no imputation, the weight
    # is renormalized away.
    metrics:
      nas_delay_per_departure:
        polarity: 1   # more locally caused delay = more strain
      taxi_out_p80:
        polarity: 1   # longer taxi-out = more ground congestion
      pct_delayed_15:
        polarity: 1   # more late departures = more strain
      cancellation_rate:
        polarity: 1   # more cancellations = more strain

  growth_trajectory:
    metrics:
      passenger_cagr_3y:
        polarity: 1   # not implemented -- needs multi-year T-100 history
      taf_forecast_growth:
        polarity: 1   # not implemented -- needs FAA TAF ingest

  feasibility:
    metrics:
      runways_per_mpax:
        polarity: 1   # more runway per passenger = more room to grow
      slot_controlled:
        polarity: -1  # a cap capital can't remove = weaker candidate

# Pillar weights per use case: a documented judgment call, not a fitted
# parameter. Composite is renormalized over the pillars an airport actually
# has, so growth_trajectory's weight is redistributed for everyone this build.
profiles:
  terminal_expansion:
    # Gate and terminal capital follows passenger demand and how binding the
    # current strain is; runway feasibility matters less.
    demand_pressure: 0.35
    capacity_strain: 0.35
    growth_trajectory: 0.15
    feasibility: 0.15

  airfield_expansion:
    # Runway and taxiway capital follows whether the airfield is the binding
    # constraint, and whether there is room to add to it.
    demand_pressure: 0.20
    capacity_strain: 0.30
    growth_trajectory: 0.15
    feasibility: 0.35

  general:
    # No investment-type bias: equal weight across all four pillars.
    demand_pressure: 0.25
    capacity_strain: 0.25
    growth_trajectory: 0.25
    feasibility: 0.25
