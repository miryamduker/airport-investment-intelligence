# Ingest-time filters. Scoring thresholds live in config/weights.yaml; this
# file defines "passenger service" at the raw-data layer, against BTS's own
# lookup tables (docs/DATA_RECON.md).

t100_segment:
  # BTS lookup table L_SERVICE_CLASS: F = Scheduled Passenger/Cargo,
  # L = Non-Scheduled Civilian Passenger/Cargo. The excluded G and P are the
  # all-cargo classes, verified to carry ~0 passengers nationally.
  # AIRCRAFT_CONFIG is deliberately not AND-ed in: 325,517 real passengers
  # in the May 2026 pull fly on combi/seaplane aircraft it would drop.
  passenger_service_classes: ["F", "L"]

# Hub-size cohorts, from each airport's share of national T-100 passengers.
# The FAA's own classification (49 U.S.C. 47102) uses a full calendar year;
# this build has one month, so these are a proxy, not an FAA determination.
hub_size:
  large_min_share: 0.01     # >= 1% of national passengers
  medium_min_share: 0.0025  # 0.25% - 1%
  small_min_share: 0.0005   # 0.05% - 0.25%
  # below small_min_share -> non_hub

# Airports where the FAA caps scheduled operations by regulatory order:
# the JFK/LGA orders (extended to 2028) and the DCA slot rule (49 U.S.C.
# 41714, 14 CFR part 93), confirmed current for the 2026 season on
# 2026-08-19. Hardcoded, not derived from any ingested table -- revisit it
# if an order lapses or another airport is added.
slot_controlled_airports: ["JFK", "LGA", "DCA"]
